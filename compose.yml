services:

    nginx:
        image: marwaneelm/pikelek-nginx:v1
        build:
            context: ./nginx 
            dockerfile: Dockerfile
        ports:
            - "80:80"
            - "443:443"
        restart: always
        networks:
            - pikelek_network
        depends_on:
            - streamlit

        volumes:
            - ./nginx.conf:/etc/nginx/conf.d/default.conf
            - /etc/letsencrypt:/etc/letsencrypt:ro

    api:
        image: marwaneelm/pikelek-api:v1
        build: 
            context: .
            dockerfile: ./src/api/Dockerfile
        container_name: fastapi_container
        ports:
            - "8000:8000"
        depends_on: 
            - postgresql
        networks:
            - pikelek_network

    
    streamlit:
        image: marwaneelm/pikelek-streamlit:v1
        build: 
            context: .
            dockerfile: ./streamlit/Dockerfile
        container_name: streamlit_container
        ports: 
            - "8501:8501"
        depends_on:
            - api
            - postgresql
        networks:
            - pikelek_network


          
    postgresql:
        container_name: postgres_db
        image: postgres:15.19-trixie
        environment:
            - POSTGRES_DB=energy_db
            - POSTGRES_USER=postgres
            - POSTGRES_PASSWORD=postmdp
        ports: 
            - "5432:5432"
        networks:
            - pikelek_network
        volumes:
            - db_data:/var/lib/postgresql/data



    scheduler:
        image: marwaneelm/pikelek-scheduler:v1
        build:
            context: .
            dockerfile: ./src/Dockerfile
        depends_on:  
            - postgresql
        networks:
            - pikelek_network



networks:
    pikelek_network:
        name: pikelek_network


volumes:
    db_data:
        name: postgres_data